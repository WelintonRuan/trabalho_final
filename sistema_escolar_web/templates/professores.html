{% extends "base.html" %}

{% block title %}Gerenciar Professores{% endblock %}

{% block content %}
<div class="page-header">
    <h1>👨‍🏫 Gerenciar Professores</h1>
    <button class="btn-primary" onclick="abrirModalCadastro()">+ Novo Professor</button>
</div>

<table class="data-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Matéria</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for prof in professores %}
        <tr>
            <td>{{ prof[0] }}</td>
            <td>{{ prof[1] }}</td>
            <td>{{ prof[2] }}</td>
            <td>
                <button class="btn-edit" onclick="editarProfessor({{ prof[0] }}, '{{ prof[1] }}', '{{ prof[2] }}')">✏️</button>
                <button class="btn-delete" onclick="removerProfessor({{ prof[0] }})">🗑️</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- Modal de Cadastro -->
<div id="modalCadastro" class="modal" style="display:none">
    <div class="modal-content">
        <span class="close" onclick="fecharModal()">&times;</span>
        <h2>Cadastrar Professor</h2>
        <form id="formProfessor">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>Matéria</label>
                <select id="materia" required>
                    <option value="">Selecione...</option>
                    <option value="matematica">Matemática</option>
                    <option value="portugues">Português</option>
                    <option value="ciencias">Ciências</option>
                    <option value="geografia">Geografia</option>
                    <option value="historia">História</option>
                    <option value="edf">Educação Física</option>
                    <option value="artes">Artes</option>
                    <option value="algoritmo">Algoritmo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Login</label>
                <input type="text" id="login" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn-primary">Cadastrar</button>
        </form>
    </div>
</div>

<script>
function abrirModalCadastro() {
    document.getElementById('modalCadastro').style.display = 'block';
}

function fecharModal() {
    document.getElementById('modalCadastro').style.display = 'none';
}

document.getElementById('formProfessor').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const dados = {
        nome: document.getElementById('nome').value,
        materia: document.getElementById('materia').value,
        login: document.getElementById('login').value,
        senha: document.getElementById('senha').value
    };
    
    const response = await fetch('/cadastrar_professor', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(dados)
    });
    
    const result = await response.json();
    if (result.success) {
        alert(result.success);
        location.reload();
    } else {
        alert('Erro: ' + result.error);
    }
});

async function removerProfessor(id) {
    if (!confirm('Tem certeza que deseja remover este professor?')) return;
    
    const response = await fetch(`/remover_professor/${id}`, {
        method: 'DELETE'
    });
    
    const result = await response.json();
    if (result.success) {
        alert(result.success);
        location.reload();
    } else {
        alert('Erro: ' + result.error);
    }
}

function editarProfessor(id, nome, materia) {
    const novoNome = prompt('Novo nome:', nome);
    if (novoNome && novoNome !== nome) {
        alterarProfessor(id, 'nome', novoNome);
    }
    
    const novaMateria = prompt('Nova matéria:', materia);
    if (novaMateria && novaMateria !== materia) {
        alterarProfessor(id, 'materia', novaMateria);
    }
}

async function alterarProfessor(id, campo, valor) {
    const response = await fetch('/alterar_professor', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id, campo, valor})
    });
    
    const result = await response.json();
    if (result.success) {
        alert(result.success);
        location.reload();
    } else {
        alert('Erro: ' + result.error);
    }
}
</script>
{% endblock %}
